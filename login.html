<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>KALASA — Connexion</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,sans-serif;background:linear-gradient(160deg,#2563eb,#1e3a8a);padding:16px}
  .c{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:26px 22px;box-shadow:0 10px 30px #0004}
  h1{margin:0;text-align:center;color:#2563eb;letter-spacing:3px}
  .s{text-align:center;color:#64748b;font-size:.85rem;margin:2px 0 18px}
  label{display:block;font-size:.8rem;color:#334155;margin:12px 0 4px}
  input[type=text],input[type=password]{width:100%;padding:12px;font-size:1rem;border:1px solid #cbd5e1;border-radius:10px}
  .r{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.85rem;color:#475569}
  button{width:100%;margin-top:18px;padding:13px;font-size:1rem;font-weight:700;color:#fff;background:#2563eb;border:0;border-radius:10px}
  button:disabled{opacity:.6}
  #msg{margin-top:12px;font-size:.88rem;text-align:center;color:#b91c1c;min-height:1.2em}
</style>
<script src="sync.js"></script>
</head><body>
  <div class="c">
    <h1>🎓 KALASA</h1><div class="s">Connexion</div>
    <label for="id">Identifiant ou e-mail</label>
    <input id="id" type="text" autocomplete="username" autocapitalize="none">
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password">
    <div class="r"><input id="rester" type="checkbox"><label for="rester" style="margin:0">Rester connecté (30 jours)</label></div>
    <button id="btn">Se connecter</button>
    <div id="msg"></div>
  </div>

<script type="module">
  import { sb } from './kalasa-db.js';
  const $ = id => document.getElementById(id);
  const msg = t => { $('msg').textContent = t; };
  const ACCUEIL = { admin: 'index.html', directeur: 'index.html', secretaire: 'eleve.html',
    enseignant: 'presence.html', caissier: 'finance.html', comptable: 'finance.html', eleve: 'espace-eleve.html' };

  /* Déjà connecté ? */
  try {
    const { data: { session } } = await sb.auth.getSession();
    const s = JSON.parse(localStorage.getItem('ksess') || 'null');
    if (session && s && s.exp > Date.now()) location.replace('index.html');
  } catch {}

  async function entrer() {
    const id = $('id').value.trim().toLowerCase(), mdp = $('mdp').value;
    if (!id || !mdp) return msg('Remplis l\'identifiant et le mot de passe.');
    const email = id.includes('@') ? id : id + '@kalasa.app';
    $('btn').disabled = true; $('btn').textContent = 'Connexion…'; msg('');
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: mdp });
      if (error) throw error;
      const uid = data.user.id;
      const { data: p, error: e2 } = await sb.from('profils').select('*').eq('user_id', uid).maybeSingle();
      if (e2) throw e2;
      if (!p || !p.actif) { await sb.auth.signOut(); throw new Error('Compte non autorisé. Contactez l\'administrateur.'); }

      const prec = (JSON.parse(localStorage.getItem('kalasa_users') || '[]')[0] || {}).id;
      if (p.role !== 'admin' || (prec && prec !== uid)) KSYNC.vider();

      const user = { id: uid, nom: p.nom, login: p.login, role: p.role, etabs: p.etabs || [], eleve: p.eleve || 0, actif: true };
      localStorage.setItem('kalasa_users', JSON.stringify([user]));
      const dur = ($('rester').checked ? 30 * 24 : 12) * 3600e3;
      localStorage.setItem('ksess', JSON.stringify({ uid, dur, exp: Date.now() + dur }));

      $('btn').textContent = 'Chargement des données…';
      await KSYNC.tout(p.role);

      const retour = new URLSearchParams(location.search).get('retour');
      location.replace(retour && /^[a-z0-9._-]+\.html/i.test(retour) ? retour : (ACCUEIL[p.role] || 'index.html'));
    } catch (e) {
      const m = e.message || String(e);
      msg(m.includes('Invalid login') ? 'Identifiant ou mot de passe incorrect.'
        : m.includes('not confirmed') ? 'Compte non confirmé : désactive « Confirm email » dans Supabase.'
        : 'Erreur : ' + m);
      $('btn').disabled = false; $('btn').textContent = 'Se connecter';
    }
  }
  $('btn').addEventListener('click', entrer);
  $('mdp').addEventListener('keydown', e => { if (e.key === 'Enter') entrer(); });
</script>
</body></html>
